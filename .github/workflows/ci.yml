# NOTE: written but not yet executed on GitHub.
name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  # Browser tests need the backend repository too: check it out beside this one, then run `npm run e2e` (see README).
